<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>catalxst login</title>
    <link rel="stylesheet" href="https://abradee.github.io/style.css">
    <link rel="icon" type="image/x-icon" href="/images/web_icon.png">
    <style>
        .hidden { display: none; }
        .input-group { margin-bottom: 12px; }
        .input-group input { width: 100%; padding: 8px; box-sizing: border-box; }
        .auth-actions { display: flex; gap: 8px; margin-bottom: 12px; }
        .auth-actions button { flex: 1; }
        hr { margin: 16px 0; border: 0; border-top: 1px solid #ccc; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Authentication Required</h2>
        <p>Please log in to connect to the game server.</p>

        <!-- Main Auth Form -->
        <div id="auth-section">
            <div class="input-group">
                <input type="email" id="email-input" placeholder="Email">
            </div>
            <div class="input-group">
                <input type="password" id="password-input" placeholder="Password">
            </div>

            <div class="auth-actions">
                <button id="email-login-btn">Log In</button>
                <button id="email-signup-btn">Sign Up</button>
            </div>

            <hr>
            <button id="google-login-btn" style="width: 100%;">Sign in with Google</button>
        </div>

        <!-- Username Prompt Section (Shown for new users) -->
        <div id="username-section" class="hidden">
            <h3>Choose a Display Name</h3>
            <p>Welcome! Enter the name other players will see.</p>
            <div class="input-group">
                <input type="text" id="username-input" placeholder="Display Name">
            </div>
            <button id="save-username-btn" style="width: 100%;">Continue to Game</button>
        </div>

        <div id="status" style="margin-top: 12px;"></div>
    </div>

    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDtmKbftcCQIBaDSQHsPhE1N2_8s-2B85s",
            authDomain: "catalxst-game.firebaseapp.com",
            projectId: "catalxst-game",
            storageBucket: "catalxst-game.firebasestorage.app",
            messagingSenderId: "845803058751",
            appId: "1:845803058751:web:0e85b4ac4f691b0344ea8a",
            measurementId: "G-ZD557G1X5N"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // Elements
        const authSection = document.getElementById('auth-section');
        const usernameSection = document.getElementById('username-section');
        const emailInput = document.getElementById('email-input');
        const passwordInput = document.getElementById('password-input');
        const usernameInput = document.getElementById('username-input');
        const emailLoginBtn = document.getElementById('email-login-btn');
        const emailSignupBtn = document.getElementById('email-signup-btn');
        const googleLoginBtn = document.getElementById('google-login-btn');
        const saveUsernameBtn = document.getElementById('save-username-btn');
        const statusText = document.getElementById('status');

        let currentUser = null;

        // Redirect to Godot
        async function redirectToGame(user) {
            statusText.innerText = "Sending token to game...";
            const idToken = await user.getIdToken();
            window.location.href = `http://localhost:8082/?token=${idToken}`;
        }

        // Check if user exists in Firestore; if not, ask for a display name
        async function handleUserDocument(user, defaultName = "") {
            statusText.innerText = "Checking player data...";
            const userDocRef = doc(db, "users", user.uid);
            const userDocSnap = await getDoc(userDocRef);

            if (!userDocSnap.exists()) {
                // Show username picker
                currentUser = user;
                authSection.classList.add('hidden');
                usernameSection.classList.remove('hidden');
                usernameInput.value = defaultName || "";
                statusText.innerText = "";
            } else {
                // User document already exists, proceed to game
                await redirectToGame(user);
            }
        }

        // Save selected username and default data to Firestore
        saveUsernameBtn.addEventListener('click', async () => {
            const chosenName = usernameInput.value.trim();
            if (!chosenName) {
                statusText.innerText = "Please enter a display name.";
                return;
            }

            saveUsernameBtn.disabled = true;
            statusText.innerText = "Creating profile...";

            try {
                const userDocRef = doc(db, "users", currentUser.uid);
                await setDoc(userDocRef, {
                    displayName: chosenName,
                    flagCount: 0,
                    level: 0,
                    money: 0,
                    orbs: 0
                });

                await redirectToGame(currentUser);
            } catch (error) {
                console.error("Firestore Error:", error);
                statusText.innerText = `Error saving profile: ${error.message}`;
                saveUsernameBtn.disabled = false;
            }
        });

        // Google Sign-In
        googleLoginBtn.addEventListener('click', async () => {
            statusText.innerText = "Waiting for Google Auth...";
            googleLoginBtn.disabled = true;

            try {
                const result = await signInWithPopup(auth, provider);
                await handleUserDocument(result.user, result.user.displayName);
            } catch (error) {
                console.error("Auth Error:", error);
                statusText.innerText = `Login failed: ${error.message}`;
                googleLoginBtn.disabled = false;
            }
        });

        // Email & Password Sign-In
        emailLoginBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                statusText.innerText = "Please enter both email and password.";
                return;
            }

            statusText.innerText = "Signing in...";
            emailLoginBtn.disabled = true;

            try {
                const result = await signInWithEmailAndPassword(auth, email, password);
                await handleUserDocument(result.user);
            } catch (error) {
                console.error("Auth Error:", error);
                statusText.innerText = `Login failed: ${error.message}`;
                emailLoginBtn.disabled = false;
            }
        });

        // Email & Password Registration
        emailSignupBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                statusText.innerText = "Please enter both email and password.";
                return;
            }

            statusText.innerText = "Creating account...";
            emailSignupBtn.disabled = true;

            try {
                const result = await createUserWithEmailAndPassword(auth, email, password);
                await handleUserDocument(result.user);
            } catch (error) {
                console.error("Auth Error:", error);
                statusText.innerText = `Registration failed: ${error.message}`;
                emailSignupBtn.disabled = false;
            }
        });
    </script>
</body>
</html>

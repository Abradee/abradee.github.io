<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>catalxst login</title>
    <link rel="stylesheet" href="https://abradee.github.io/style.css">
    <link rel="icon" type="image/x-icon" href="/images/web_icon.png">
</head>
<body>

    <div class="login-box">
        <h2>Authentication Required</h2>
        <p>Please log in to connect to the game server.</p>
        <button id="login-btn">Sign in with Google</button>
        <div id="status"></div>
    </div>

    <!-- Use Firebase ES Modules via CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDtmKbftcCQIBaDSQHsPhE1N2_8s-2B85s",
            authDomain: "catalxst-game.firebaseapp.com",
            projectId: "catalxst-game",
            storageBucket: "catalxst-game.firebasestorage.app",
            messagingSenderId: "845803058751",
            appId: "1:845803058751:web:0e85b4ac4f691b0344ea8a",
            measurementId: "G-ZD557G1X5N"
        };

        // Initialize Firebase & Services
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const loginBtn = document.getElementById('login-btn');
        const statusText = document.getElementById('status');

        loginBtn.addEventListener('click', async () => {
            statusText.innerText = "Waiting for Google Auth...";
            loginBtn.disabled = true;

            try {
                // 1. Sign in with Google Popup
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                statusText.innerText = "Checking player data...";

                // 2. Check if Firestore document exists for this UID
                const userDocRef = doc(db, "users", user.uid);
                const userDocSnap = await getDoc(userDocRef);

                // 3. If new user, create the document with default fields
                if (!userDocSnap.exists()) {
                    statusText.innerText = "Creating profile...";
                    await setDoc(userDocRef, {
                        displayName: user.displayName || "user",
                        flagCount: 0,
                        level: 0,
                        money: 0,
                        orbs: 0
                    });
                }

                // 4. Generate JWT for Godot
                statusText.innerText = "Sending token to game...";
                const idToken = await user.getIdToken();

                // 5. Redirect back to Godot's local server
                window.location.href = `http://localhost:8082/?token=${idToken}`;

            } catch (error) {
                console.error("Auth Error:", error);
                statusText.innerText = `Login failed: ${error.message}`;
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
